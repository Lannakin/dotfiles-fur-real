-- conky --config=$HOME/.config/herbstluftwm/conky/system_stats.conf
-- vim: filetype=lua
-- ascii bars script is at: $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh
-- NOTE: conky.conf's % numbers are not synchronized with the bars.
--##################################################
--## VinDSL | rev 16-09-02 13:53 | ver 1.10.1-P7  ##
--##################################################
--##             August 2016 Series               ##
--##################################################
--
-- WARNING: Heavily modified by LiterallySomeCat aka Lannakin
-- openlogos fonts did not have the character in a reasonable character
-- location, so I edited another font and hand-drew a pixel Arch Linux
-- logo.
--
-- rebuild font cache file: fc-cache -fv
conky.config = {

  use_xft = true,
  xftalpha = 1.0,
  override_utf8_locale = true,
  text_buffer_size = 1592,
  max_user_text = 32768,
  uppercase = false,
  top_name_width = 10,
  short_units = true,
  pad_percents = 0,

  background = true,
  update_interval = 1.0,
  total_run_times = 0,
  own_window = true,
  own_window_class = "Conky",
  own_window_colour = "#FDF6E3",
  own_window_transparent = false,
  own_window_type = "normal",
  own_window_hints = "undecorated,below,sticky,skip_taskbar,skip_pager",
  own_window_argb_visual = true,
  own_window_argb_value = 245,

  imlib_cache_size = 1,
  double_buffer = true,
  default_color = "#586E75",
  default_shade_color = "#586E75",
  draw_outline = false,
  draw_borders = true,
  draw_graph_borders = false,
  draw_shades = false;  --# ugly text shadow
  out_to_ncurses = false,
  out_to_console = false,

  alignment = "top_right",
  minimum_width = 266,
  minimum_height = 153,
  gap_x = -2546,
  gap_y = 33,
  border_inner_margin = 7,
  border_outer_margin = 0,
  border_width = 2,
  use_spacer = "right",
  no_buffers = true,

  font0 = "Bm437 CompaqThin 8x8:size=6",
  font1 = "Bm437 Compaq Port3:normal:size=12",
  font2 = "Bm437 ACM 8x14 ARCH:size=6",

  color0 = "#073642",
  color1 = "#657B83",
  color2 = "#93A1A1",
  color3 = "#CFCABC",
  color4 = "#FDF6E3",
  color6 = "#CB4B16",
  color7 = "#859900",
  color8 = "#B8D8D6",
  color9 = "#C5E7E5",
}
conky.text = [[
# #002B36 #586E75 #839496 #dbd6c3 #B58900 #DC322F #6C71C4 #2AA198 #B8D8D6
# #073642 #657B83 #93A1A1 #FDF6E3 #CB4B16 #D33682 #268bC2 #859900 #C5E7E5
##################################
##            SYSTEM            ##
##################################
${voffset 0}${font1}${#2AA198}SYSTEM${offset 4}${color2}${voffset -2}${hr 2}
${voffset 5}${font2}${#268bC2} @  ${voffset -1}${font0}${color6}${execpi 1800 lsb_release -sd | sed -e 's/Ubuntu/Ubuntu/g' -e 's/development/dev/g'}${alignr}${execpi 1800 lsb_release -sr}
${voffset 8}${offset -2}${voffset -4}${font0}${color6}${offset 3}${sysname}${offset 3}${kernel}${alignr}${font0}${machine}
${voffset 8}${font0}${color2}${voffset -3}${font0}${color2}System Uptime${voffset -1}${alignr}${font0}${color6}${uptime_short}
##################################
##          PROCESSORS          ##
##################################
${voffset 8}${font1}${#2AA198}PROCESSOR LOAD${offset 8}${color2}${voffset -2}${hr 2}
${voffset 6}${font0}${color2}CPU1 ${voffset -1}${execpi 1 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu 0}
${voffset 6}${font0}${color2}CPU2 ${voffset -1}${execpi 1 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu 1}
${voffset 6}${font0}${color2}CPU3 ${voffset -1}${execpi 1 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu 2}
${voffset 6}${font0}${color2}CPU4 ${voffset -1}${execpi 1 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu 3}
${voffset 6}${font0}${color2}CPU5 ${voffset -1}${execpi 1 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu 4}
${voffset 6}${font0}${color2}CPU6 ${voffset -1}${execpi 1 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu 5}
${voffset 6}${font0}${color2}CPU7 ${voffset -1}${execpi 1 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu 6}
${voffset 6}${font0}${color2}CPU8 ${voffset -1}${execpi 1 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu 7}
##################################
##            MEMORY            ##
##################################
${voffset 8}${font1}${#2AA198}MEMORY${offset 8}${color2}${voffset -2}${hr 2}
${voffset 3}${font0}${color2}RAM${goto 97}${font0}${mem}${goto 133} /${offset 5}${memmax}${alignr}${memperc}%
${voffset 6}${font0}${color2}${execpi 2 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh memory}
##################################
##           GPU LOAD           ##
##################################
${voffset 8}${font1}${#2AA198}GPU LOAD${offset 8}${color2}${voffset -2}${hr 2}
${voffset 3}${font0}${color2}${voffset -1}GPU0 ${font0}${offset 1}${voffset -0.5}${execpi 2 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh gpu}${font0}${color2}${alignr}${exec 'cat /sys/class/drm/card1/device/gpu_busy_percent'}%
##################################
##           THERMALS           ##
##################################
${voffset 8}${font1}${#2AA198}THERMALS${offset 8}${color2}${voffset -2}${hr 2}
${voffset 3}${font0}${color2}CPU ${execpi 5 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh cpu_temp} ${color2}${alignr}${offset 4}${hwmon 2 temp 1}${alignr}°C
${voffset 6}${font0}${color2}GPU ${execpi 5 $HOME/.config/herbstluftwm/conky/solarized-asciibars.sh gpu_temp} ${color2}${alignr}${offset 4}${hwmon 5 temp 1}${alignr}°C
]]
