-- rebuild font cache file: fc-cache -fv
conky.config = {

  use_xft = true,
  xftalpha = 1,
  override_utf8_locale = true,
  text_buffer_size = 1592,
  max_user_text = 32768,
  uppercase = false,
  top_name_width = 10,
  short_units = true,
  pad_percents = 0,

  background = true,
  update_interval = 1.0,
  total_run_times = 0,
  own_window = true,
  own_window_class = "Conky",
  own_window_colour = "#EEFDF6E3",
  own_window_title = "solarized-keybinds-lazyvim",
  own_window_type = "desktop",
  own_window_hints = "undecorated,below,sticky,skip_taskbar,skip_pager",

  imlib_cache_size = 1,
  double_buffer = true,
  default_color = "#586E75",
  default_shade_color = "#586E75",
  draw_outline = false,
  draw_borders = true,
  draw_graph_borders = false,
  draw_shades = false, -- ugly text shadow
  out_to_ncurses = false,
  out_to_console = false,

  alignment = "bottom_left",
  minimum_width = 360,
  minimum_height = 153,
  gap_x = -2547,
  gap_y = 33,
  border_inner_margin = 7,
  border_outer_margin = 0,
  border_width = 2,
  use_spacer = "right",
  no_buffers = true,

  cpu_avg_samples = 1,
  net_avg_samples = 2,

  font0 = "Bm437 CompaqThin 8x8:size=6",
  font1 = "Bm437 Compaq Port3:normal:size=12",

  color0 = "#073642",
  color1 = "#657B83",
  color2 = "#93A1A1",
  color3 = "#CFCABC",
  color4 = "#FDF6E3",
  color5 = "#2AA198",
  color6 = "#CB4B16",
  color7 = "#859900",
  color8 = "#B8D8D6",
  color9 = "#C5E7E5",
}
conky.text = [[
# #002B36 #586E75 #657B83 #EEE8D5 #B58900 #DC322F #6C71C4 #2AA198 #B8D8D6
# #073642 #657B83 #93A1A1 #FDF6E3 #CB4B16 #D33682 #268bC2 #859900 #C5E7E5
##################################
##            LEGEND            ##
##################################
${voffset 0}${font1}${color5}LEGEND${offset 4}${color2}${voffset -2}${hr 2}
${voffset 3}${font0}${color6}ldr  ${color3}= ${color6}<Leader> ${alignr}${color7}spacebar
${voffset 5}${font0}${color1}CMD${color6}: ${color3}= ${color6}COMMAND ${alignr}${color7}cmdline (colon)
##################################
##        LAZYVIM CONTROL       ##
##################################
${voffset 8}${font1}${color5}LAZYVIM CONTROL${offset 4}${color2}${voffset -2}${hr 2}
${voffset 3}${font0}${color1}CMD${color6}:${#6C71C4}Q${alignr}${color7}quit
${voffset 5}${font0}${color1}CMD${color6}:${#6C71C4}QA${alignr}${color7}quit all
${voffset 5}${font0}${color1}CMD${color6}:${#6C71C4}WQA${alignr}${color7}write and quit all
${voffset 3}${font0}${#6C71C4}i${alignr}${color7}insert mode
${voffset 3}${font0}${#6C71C4}Esc${alignr}${color7}exit insert mode
${voffset 3}${font0}${color6}ctrl ${color3}+ ${#6C71C4}o${alignr}${color7}CMD, -> insert mode
##################################
##            EDITOR            ##
##################################
${voffset 8}${font1}${color5}EDITOR${offset 4}${color2}${voffset -2}${hr 2}
${voffset 3}${font0}${color6}ldr  ${#6C71C4}s${alignr}${color7}signature help
${voffset 5}${font0}${color6}ldr  ${#6C71C4}l${alignr}${color7}no hl search
${voffset 5}${font0}${color6}ctrl ${color3}+ ${#6C71C4}b${alignr}${color7}toggle neo-tree
${voffset 5}${font0}${color1}CMD${color6}:${#6C71C4}'<,'>s/${color3}x${#6C71C4}/${color3}y${#6C71C4}/g${alignr}${color7}replace ${color3}x${color7} w/ ${color3}y${color7} in selection
##################################
##           MOVEMENT           ##
##################################
${voffset 8}${font1}${color5}MOVE CURSOR TO${offset 4}${color2}${voffset -2}${hr 2}
${voffset 3}${font0}${#6C71C4}0  ${alignr}${color7}first char in line
${voffset 3}${font0}${#6C71C4}g0 ${alignr}${color7}first char in line (screen)
${voffset 5}${font0}${#6C71C4}$$  ${alignr}${color7}next end-of-line
${voffset 5}${font0}${#6C71C4}g$$ ${alignr}${color7}next end-of-line (screen)
${voffset 5}${font0}${#6C71C4}gm  ${alignr}${color7}middle of line
${voffset 5}${font0}${#6C71C4}gM  ${alignr}${color7}middle of line (screen)
${voffset 5}${font0}${#6C71C4}| [int]${alignr}${color7}to column int
${voffset 5}${font0}${color6}ctrl ${color3}+ ${color2}↑ ${#6C71C4}[int]${alignr}${color7}↑ int lines
${voffset 5}${font0}${color6}ctrl ${color3}+ ${color2}↓ ${#6C71C4}[int]${alignr}${color7}↓ int lines
##################################
##       BUFFER ADJUSTMENT      ##
##################################
${voffset 8}${font1}${color5}BUFFER ADJUSTMENT${offset 4}${color2}${voffset -2}${hr 2}
${voffset 3}${font0}${color6}ldr ${#6C71C4}w${color6}ctrl ${color3}+ ${#6C71C4}←↑→↓${alignr}${color7}resize ←↑→↓
${voffset 5}${font0}${color6}ldr ${#6C71C4}wv${alignr}${color7}split vertically
${voffset 5}
##################################
##            LAYOUT            ##
##################################
# ${voffset 8}${font1}${color5}WINDOW MANAGEMENT${offset 4}${color2}${voffset -2}${hr 2}
# ${voffset 3}${font0}${color6}alt ${color3}+ ${#6C71C4}Q${alignr}${color7}float monitor
# ${voffset 5}${font0}${color6}alt ${color3}+ ${#6C71C4}R${alignr}${color7}fullscreen
# ${voffset 5}${font0}${color6}alt ${color3}+ ${#6C71C4}C${alignr}${color7}pseudotile
# ${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}F${alignr}${color7}float focus
# ${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}D${alignr}${color7}decorate focus
# ${voffset 5}${font0}${color6}alt ${color3}+ ${#D33682}super ${color3}+ ${#6C71C4}D${alignr}${color7}dual head focus
# ${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}M${alignr}${color7}minimize focus
# ${voffset 5}${font0}${color6}alt ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}M${alignr}${color7}select minimized
# ${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}M${alignr}${color7}restore
##################################
##     SAVE / RECALL LAYOUT     ##
##################################
# ${voffset 8}${font1}${color5}SAVE / RECALL LAYOUT${offset 4}${color2}${voffset -2}${hr 2}
# ${voffset 3}${font0}${color6}alt ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}K${alignr}${color7}save
# ${voffset 5}${font0}${color6}alt ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}comma${alignr}${color7}load${font}
${voffset 2}
]]
-- --- [ CONKY FORMAT SNIPPETS ] ---

--  -- [ SOLARIZED COLORS] --
-- #002B36 #586E75 #657B83 #EEE8D5 #B58900 #DC322F #6C71C4 #2AA198 #B8D8D6
-- #073642 #657B83 #93A1A1 #FDF6E3 #CB4B16 #D33682 #268bC2 #859900 #C5E7E5

-- color0 = #073642,
-- color1 = #657B83,
-- color2 = #93A1A1,
-- color3 = #cfcabc,
-- color4 = #FDF6E3,
-- color5 = #2AA198,
-- color6 = #CB4B16,
-- color7 = #859900,
-- color8 = #B8D8D6,
-- color9 = #C5E7E5,

--  -- [ HEADERS ] --
-- first header
-- ${voffset 0}${font1}${color5}HEADER_TEXT${offset 4}${color8}${voffset -2}${hr 2}
-- header
-- ${voffset 8}${font1}${color5}HEADER_TEXT${offset 4}${color8}${voffset -2}${hr 2}

--  -- [ BODY TEXT ] --
-- voffset: first line after header + set font0
-- ${voffset 3}${font0}
-- voffset: line after header + set font0
-- ${voffset 5}${font0}

-- alignment: right + description text color
-- ${alignr}${color7}

-- arrows:
-- ← ↑ → ↓
