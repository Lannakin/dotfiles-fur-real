conky.text = [[
# #002B36 #586E75 #839496 #EEE8D5 #B58900 #DC322F #6C71C4 #2AA198 #B8D8D6
# #073642 #657B83 #93A1A1 #FDF6E3 #CB4B16 #D33682 #268bC2 #859900 #C5E7E5
##################################
##     HERBSTLUFTWM CONTROL     ##
##################################
${voffset 0}${font1}${#2AA198}HERBSLUFTWM CONTROL${offset 4}${color8}${voffset -2}${hr 2}
${voffset 3}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}Q${alignr}${color7}quit
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}R${alignr}${color7}reload
##################################
##         CYCLE FOCUS          ##
##################################
${voffset 8}${font1}${#2AA198}CYCLE FOCUS${offset 4}${color8}${voffset -2}${hr 2}
${voffset 3}${font0}${color6}alt ${color3}+ ${#6C71C4}backspace${alignr}${color7}cycle monitor
${voffset 5}${font0}${color6}alt ${color3}+ ${#6C71C4}tab${alignr}${color7}cycle all +1
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}tab${alignr}${color7}cycle all -1
${voffset 5}${font0}${color6}alt ${color3}+ ${#6C71C4}C${alignr}${color7}cycle
##################################
##       MOVEMENT -- FOCUS      ##
##################################
${voffset 8}${font1}${#2AA198}MOVEMENT${offset 4}${color8}${voffset -2}${hr 2}
${voffset 3}${font0}${color6}alt ${color3}+ ${#6C71C4}${alignr}${color7}move focused
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}${alignr}${color7}move client
##################################
##       FRAME ADJUSTMENT       ##
##################################
${voffset 8}${font1}${#2AA198}FRAME ADJUSTMENT${offset 4}${color8}${voffset -2}${hr 2}
${voffset 3}${font0}${color6}alt ${color3}+ ${#6C71C4}O${alignr}${color7}split under ½
${voffset 5}${font0}${color6}alt ${color3}+ ${#6C71C4}I${alignr}${color7}split right ½
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}space${alignr}${color7}explode
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}${alignr}${color7}resize
${voffset 5}${font0}${color6}alt ${color3}+ ${#6C71C4}R${alignr}${color7}remove
##################################
##            LAYOUT            ##
##################################
${voffset 8}${font1}${#2AA198}WINDOW MANAGEMENT${offset 4}${color8}${voffset -2}${hr 2}
${voffset 3}${font0}${color6}alt ${color3}+ ${#6C71C4}Q${alignr}${color7}float monitor
${voffset 5}${font0}${color6}alt ${color3}+ ${#6C71C4}R${alignr}${color7}fullscreen
${voffset 5}${font0}${color6}alt ${color3}+ ${#6C71C4}C${alignr}${color7}pseudotile
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}F${alignr}${color7}float focus
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}D${alignr}${color7}decorate focus
${voffset 5}${font0}${color6}alt ${color3}+ ${#D33682}super ${color3}+ ${#6C71C4}D${alignr}${color7}dual head focus
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${#6C71C4}M${alignr}${color7}minimize focus
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}M${alignr}${color7}select minimized
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}shift ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}M${alignr}${color7}restore
##################################
##     SAVE / RECALL LAYOUT     ##
##################################
${voffset 8}${font1}${#2AA198}SAVE / RECALL LAYOUT${offset 4}${color8}${voffset -2}${hr 2}
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}K${alignr}${color7}save
${voffset 5}${font0}${color6}alt ${color3}+ ${color6}ctrl ${color3}+ ${#6C71C4}comma${alignr}${color7}load${font}
${voffset 2}
]]
