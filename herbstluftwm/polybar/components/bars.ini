[bar]
fill = ﭳ
empty = ﭳ
indicator = 
width = 6
format = %{T4}%fill%%indicator%%empty%%{F-}%{T-}

[module/filesystem_bar]
type = internal/fs

#Mountpoints to display
mount-0 = /
##mount-1 = /home
##mount-2 = /var

#Seconds to sleep between updates
#Default: 30
interval = 30

#Display fixed precision values
#Default: false
fixed-values = false

#Spacing between entries
#Default: 2
##spacing = 4

#Available tags:
#  <label-mounted> (default)
#  <bar-free>
#  <bar-used>
#  <ramp-capacity>
format-mounted = <bar-used> <label-mounted>
format-mounted-prefix = " "
format-mounted-background = ${colors.background}
format-mounted-padding = 1

#Available tags:
#  <label-unmounted> (default)
format-unmounted = <label-unmounted>
format-unmounted-prefix = " "
format-unmounted-background = ${colors.background}
format-unmounted-padding = 1

#Available tokens:
#  %mountpoint%
#  %type%
#  %fsname%
#  %percentage_free%
#  %percentage_used%
#  %total%
#  %free%
#  %used%
#Default: %mountpoint% %percentage_free%%
label-mounted = "%used%/%total%"

#Available tokens:
#  %mountpoint%
#Default: %mountpoint% is not mounted
label-unmounted = "%mountpoint%: not mounted"

#Only applies if <bar-used> is used
bar-used-format = ${bar.format}
bar-used-width = ${bar.width}
bar-used-gradient = false

bar-used-indicator = ${bar.indicator}
bar-used-indicator-foreground = ${colors.foreground}

bar-used-fill = ${bar.fill}
bar-used-foreground-0 = ${colors.green}
bar-used-foreground-1 = ${colors.green}
bar-used-foreground-2 = ${colors.yellow}
bar-used-foreground-3 = ${colors.yellow}
bar-used-foreground-4 = ${colors.red}

bar-used-empty = ${bar.empty}
bar-used-empty-foreground = ${colors.foreground-alt}

#_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/memory_bar]
type = internal/memory

#Seconds to sleep between updates
#Default: 1
interval = 2

#Available tags:
#  <label> (default)
#  <bar-used>
#  <bar-free>
#  <ramp-used>
#  <ramp-free>
#  <bar-swap-used>
#  <bar-swap-free>
#  <ramp-swap-used>
#  <ramp-swap-free>
format = <bar-used> <label>
format-prefix = " "
format-background = ${colors.background}
format-padding = 1

#Available tokens:
#  %percentage_used% (default)
#  %percentage_free%
#  %gb_used%
#  %gb_free%
#  %gb_total%
#  %mb_used%
#  %mb_free%
#  %mb_total%
#  %percentage_swap_used%
#  %percentage_swap_free%
#  %mb_swap_total%
#  %mb_swap_free%
#  %mb_swap_used%
#  %gb_swap_total%
#  %gb_swap_free%
#  %gb_swap_used%

label = "%mb_used%"

#Only applies if <bar-used> is used
bar-used-format = ${bar.format}
bar-used-width = ${bar.width}
bar-used-gradient = false

bar-used-indicator = ${bar.indicator}
bar-used-indicator-foreground = ${colors.foreground}

bar-used-fill = ${bar.fill}
bar-used-foreground-0 = ${colors.green}
bar-used-foreground-1 = ${colors.green}
bar-used-foreground-2 = ${colors.yellow}
bar-used-foreground-3 = ${colors.yellow}
bar-used-foreground-4 = ${colors.red}

bar-used-empty = ${bar.empty}
bar-used-empty-foreground = ${colors.foreground-alt}

#_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/mpd_bar]
type = internal/mpd

#Host where mpd is running (either ip or domain name)
#Can also be the full path to a unix socket where mpd is running.
##host = 127.0.0.1
##port = 6600
##password = mysecretpassword

#Seconds to sleep between progressbar/song timer sync
#Default: 1
interval = 1

#Available tags:
#  <label-song> (default)
#  <label-time>
#  <bar-progress>
#  <toggle> - gets replaced with <icon-(pause|play)>
#  <toggle-stop> - gets replaced with <icon-(stop|play)>
#  <icon-random>
#  <icon-repeat>
#  <icon-repeatone> (deprecated)
#  <icon-single> - Toggle playing only a single song. Replaces <icon-repeatone>
#  <icon-consume>
#  <icon-prev>
#  <icon-stop>
#  <icon-play>
#  <icon-pause>
#  <icon-next>
#  <icon-seekb>
#  <icon-seekf>
format-online = <label-song> <bar-progress> <label-time>
format-online-prefix = "%{T6}%{T-}"
format-online-background = ${colors.background}
format-online-padding = 1

;format-playing = ${self.format-online}
;format-paused = ${self.format-online}
;format-stopped = ${self.format-online}

#Available tags:
#  <label-offline>
format-offline = <label-offline>
format-offline-prefix = "%{T6}%{T-}"
format-offline-background = ${colors.background}
format-offline-padding = 1

#Available tokens:
#  %artist%
#  %album-artist%
#  %album%
#  %date%
#  %title%
#Default: %artist% - %title%
label-song =  " %artist% - %title%"
label-song-maxlen = 25
label-song-ellipsis = true

#Available tokens:
#  %elapsed%
#  %total%
#Default: %elapsed% / %total%
label-time = "%elapsed% / %total%"

#Available tokens:
#  None
label-offline = " Offline"

#Only applies if <icon-X> is used
icon-play = 
icon-pause = 
icon-stop = 
icon-next = 
icon-prev = 
icon-seekf = 
icon-seekb = 
icon-random = 
icon-repeat = 
icon-repeatone = 
icon-single = 
icon-consume =

#Used to display the state of random/repeat/repeatone/single
#Only applies if <icon-[random|repeat|repeatone|single]> is used
toggle-on-foreground = ${colors.green}
toggle-off-foreground = ${colors.red}

#Only applies if <bar-progress> is used
bar-progress-format = ${bar.format}
bar-progress-width = ${bar.width}
bar-progress-gradient = false

bar-progress-indicator = ${bar.indicator}
bar-progress-indicator-foreground = ${colors.foreground}

bar-progress-fill = ${bar.fill}
bar-progress-foreground-0 = ${colors.green}
bar-progress-foreground-1 = ${colors.green}
bar-progress-foreground-2 = ${colors.yellow}
bar-progress-foreground-3 = ${colors.yellow}
bar-progress-foreground-4 = ${colors.red}

bar-progress-empty = ${bar.empty}
bar-progress-empty-foreground = ${colors.foreground-alt}

