[module/cpu]
type = internal/cpu
interval = 2
format-background = ${colors.background}
format-prefix =%{T5} %{T-}
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/dunst]
type = custom/text

label = %{T6}
label-background = ${colors.background}
label-foreground = ${colors.primary}

# "click-(left|middle|right)" will be executed using "/usr/bin/env sh -c $COMMAND"
click-left = $HOME/.config/herbstluftwm/polybar/scripts/dunst-notification-history.sh display-history 10
click-middle = $HOME/.config/herbstluftwm/polybar/scripts/dunst-notification-history.sh display-history
click-right = $HOME/.config/herbstluftwm/polybar/scripts/dunst-notification-history.sh close-history &
format-background = ${colors.background}
format-foreground = ${colors.primary}

[module/date]
type = internal/date
interval = 2.0

time = %{O-2}%{T6}%{F#CB4B16} %{F-}%{T-}%I:%M %p
time-alt = %{O-2}%{T6}%{F#CB4B16} %{F-}%{T-}%a, %d %b %Y

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-padding = 2

label = %time%

[module/network]
type = internal/network
interface-type = wired
padding = 2
format-foreground = ${colors.primary}

# Seconds to sleep between updates
interval = 1.0

# Test connectivity every Nth update
# A value of 0 disables the feature
# NOTE: Experimental (needs more testing)
# ping-interval = 3

# Accumulate values from all interfaces when querying for up/down rate
# Default: false
accumulate-stats = true

# Consider an `UNKNOWN` interface state as up.
# Some devices have an unknown state, even when they're running
# Default: false
unknown-as-up = true

# Available tags:
#  <label-connected> (default)
#  <ramp-signal>
format-connected = <label-connected>
format-connected-prefix = "%{T6} %{T-}"
format-connected-background = ${colors.background}
format-connected-foreground = ${colors.green}
format-connected-padding = 1

# Available tags:
#  <label-disconnected> (default)
format-disconnected = <label-disconnected>
format-disconnected-prefix = "%{T6} %{T-}"
format-disconnected-background = ${colors.background}
format-disconnected-padding = 1

# Available tags:
#  <label-connected> (default)
#  <label-packetloss>
#  <animation-packetloss>
format-packetloss = <animation-packetloss> <label-connected>

# Available tokens:
#  %ifname%    [wireless+wired]
#  %local_ip%  [wireless+wired]
#  %local_ip6% [wireless+wired]
#  %upspeed%   [wireless+wired]
#  %downspeed% [wireless+wired]
#  %linkspeed% [wired]
# Default: %ifname% %local_ip%
# label-connected = %ifname%  %downspeed%  %linkspeed%
label-connected = "%ifname% %{T6}%{T-} %downspeed% %{T6}%{T-} %linkspeed%"
label-connected-foreground = ${colors.green}
#%{A1:networkmanager_dmenu &:}

# Available tokens:
#  %ifname%    [wireless+wired]
# Default: (none)
label-disconnected = %{A1:networkmanager_dmenu &:} Offline%{A}
##label-disconnected-foreground = #66ffffff

# Only applies if <animation-packetloss> is used
animation-packetloss-0 = ⚠
animation-packetloss-0-foreground = #ffa64c
animation-packetloss-1 = ⚠
animation-packetloss-1-foreground = #000000
# Framerate in milliseconds
animation-packetloss-framerate = 500

#_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/network-networkmanager]
type = custom/script
exec = $HOME/.config/herbstluftwm/polybar/scripts/network-networkmanager.sh
tail = true
format-background = ${colors.background}
format-foreground = ${colors.primary}

[module/pulseaudio]
type = internal/pulseaudio

click-right= pwvucontrol &
format-background = ${colors.background}

format-volume-prefix = "%{T5} "
format-volume-prefix-foreground = ${colors.primary}
format-volume-prefix-background = ${colors.background}
format-volume = <label-volume>

label-padding = 1
label-volume = "%{T1}%{O10}%percentage%% "
label-volume-background= ${colors.background}

label-muted = "%{T5}%{T1}muted "
label-muted-foreground = ${colors.disabled}
label-muted-background= ${colors.background}

use-ui-max = false

#Interval for volume increase/decrease (in percent points)
interval = 5

# Available tags:
#  <label-volume> (default)
#  <ramp-volume>
#  <bar-volume>
# format-volume = <ramp-volume> <label-volume>
# format-volume-background = ${colors.background}
# format-volume-padding = 1

# Available tags:
#  <label-muted> (default)
#  <ramp-volume>
#  <bar-volume>
# format-muted = <label-muted>
# format-muted-prefix = 
# format-muted-background = ${colors.background}
# format-muted-padding = 1

# Available tokens:
#  %percentage% (default)
# label-volume = %percentage%%

# Available tokens:
#  %percentage% (default
# label-muted = " muted"
# label-muted-foreground = ${colors.foreground}

# Only applies if <ramp-volume> is used
# ramp-volume-0 = 
# ramp-volume-1 = 
# ramp-volume-2 = 

[module/xkeyboard]
type = internal/xkeyboard

format = <label-indicator>
format-background = ${colors.background}
format-foreground = ${colors.foreground}
label-indicator-padding = 2
label-indicator-margin = 0
label-indicator-foreground = ${colors.base3}
label-indicator-background = ${colors.primary}
